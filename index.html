<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公民段考闖關卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one card per screen, level map home; big type, one idea at a time */
/* Single look, taken from a gouache illustration: peach sky fading into deep teal, cream paper cards,
   level colours borrowed from the fruit, birds and flowers. Same in light and dark on purpose. */
:root{
  --sky:#f1cdb6; --mid:#7fb0a6; --deep:#155a5e;
  --bg:#f6efe6; --card:#fbf6ee; --fg:#2c3a3a; --mute:#6c7470; --line:#e6dccd;
  --ok:#3f8a52; --no:#c8553d;
  --c1:#2b7c7e; --c2:#4a7fae; --c3:#e0782f; --c4:#b8607e; --c5:#c8553d; --c6:#4f8f5a; --c7:#9c8a1c; --c8:#7a5446;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"LXGW WenKai TC","Noto Sans TC","Kaiti TC",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep) linear-gradient(180deg,var(--sky) 0%,#e9c7b2 18%,var(--mid) 60%,var(--deep) 100%) fixed;color:var(--fg);font-family:var(--font);margin:0}
.lv,.card,.btn.again,.back{box-shadow:0 6px 18px -10px rgba(20,60,60,.45)}
.back{background:var(--card)!important}
.finish{background:var(--card);border-radius:28px;padding:30px 20px!important}
.reset{color:#f6efe6!important}
h1,.ans,.big,.lv .n,.prompt{font-family:var(--display)}
.hero{display:flex;gap:14px;align-items:flex-end}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.art{flex:none;width:118px;max-width:34%;aspect-ratio:580/755;object-fit:cover;border-radius:60px 60px 14px 14px;box-shadow:0 10px 24px -12px rgba(20,60,60,.6)}
.got{margin:0;font-size:.95rem;color:var(--fg)}
.got b{font-family:var(--display);font-size:1.3rem;color:var(--c3)}
.art-win{width:62%;max-width:240px;aspect-ratio:580/755;object-fit:cover;border-radius:120px 120px 18px 18px;box-shadow:0 14px 30px -14px rgba(20,60,60,.6)}
@media (prefers-reduced-motion:no-preference){.art-win{animation:rise .5s ease-out}@keyframes rise{from{transform:translateY(12px) scale(.96);opacity:.5}to{transform:none;opacity:1}}}
.wrap{max-width:520px;margin:0 auto;padding:16px;padding-block:18px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.6rem;font-weight:900;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:.95rem;line-height:1.6;margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent,var(--c2));outline-offset:2px}

/* home */
.levels{display:flex;flex-direction:column;gap:10px}
.lv{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--fg);width:100%}
.lv .badge{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;font-weight:900;color:#fff;background:var(--accent)}
.lv .t{flex:1;min-width:0}
.lv .n{font-weight:700;font-size:1.08rem}
.lv .d{color:var(--mute);font-size:.85rem;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.done-chip{flex:none;font-size:.8rem;font-weight:700;color:var(--ok)}

/* play */
.top{display:flex;align-items:center;gap:10px}
.back{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:.95rem}
.lvname{font-weight:700;color:var(--accent);flex:1;min-width:0}
.count{color:var(--mute);font-size:.9rem;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.cur{outline:2px solid var(--accent);outline-offset:1px}

.card{background:var(--card);border-radius:22px;border:2px solid var(--accent);padding:22px 20px;min-height:340px;display:flex;flex-direction:column;gap:14px;position:relative}
.kind{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px}
.prompt{font-size:1.45rem;font-weight:700;line-height:1.5;text-wrap:balance}
.tapnote{margin-top:auto;color:var(--mute);font-size:.9rem;text-align:center}
.flip{all:unset;display:contents;cursor:pointer}
.ans{font-size:1.9rem;font-weight:900;color:var(--accent);line-height:1.3}
.hook{font-size:1.1rem;line-height:1.7;background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:14px;padding:12px 14px}
.ex{font-size:.98rem;line-height:1.7;color:var(--mute)}
.ex b{color:var(--fg)}
.mine{font-size:.85rem;font-weight:700;color:var(--no)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.opt{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:14px;font-size:1.12rem;font-weight:500;text-align:left}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.verdict{font-weight:900;font-size:1.3rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:14px;padding:16px;font-size:1.05rem;font-weight:700}
.btn.again{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.btn.got{background:var(--accent);color:#fff}
.btn.wide{grid-column:1/-1}

.finish{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-block:30px}
.big{font-size:3.4rem;font-weight:900;color:var(--accent)}
.reset{background:none;border:none;color:var(--mute);text-decoration:underline;font-size:.85rem;align-self:center}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .22s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>

const KEY="civics-cards-v1";
let st={};
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/\n/g,"<br>");
const known=i=>(st[i]||[]).length;

function home(){
  document.documentElement.style.removeProperty("--accent");
  const total=L.reduce((s,l)=>s+l.cards.length,0), got=L.reduce((s,l,i)=>s+known(i),0);
  app.innerHTML=`<div class="hero"><div class="hero-t"><h1>公民段考闖關卡</h1>
  <p class="sub">第 1、2 章，兩份考卷的考點全在這裡。一次只看一張，點一下翻面。</p>
  <p class="got">已記住 <b>${got}</b> / ${total} 張</p></div>
  <img class="art" src="${ART}" alt=""></div>
  <div class="levels">${L.map((l,i)=>{
    const n=known(i),p=Math.round(n/l.cards.length*100);
    return `<button class="lv" style="--accent:var(${l.c})" data-i="${i}">
      <span class="badge">${l.k}</span>
      <span class="t"><div class="n">${i+1}. ${l.name}</div><div class="d">${l.d}</div>
      <div class="bar"><i style="width:${p}%"></i></div></span>
      ${n===l.cards.length?'<span class="done-chip">過關</span>':`<span class="count">${n}/${l.cards.length}</span>`}
    </button>`}).join("")}</div>
  <button class="reset" id="rs">清除進度</button>`;
  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>play(+b.dataset.i));
  document.getElementById("rs").onclick=()=>{st={};save();home()};
}

let lvl,queue,pos,flipped,picked;
function play(i){
  lvl=i; const done=new Set(st[i]||[]);
  queue=L[i].cards.map((_,j)=>j).filter(j=>!done.has(j));
  if(!queue.length) queue=L[i].cards.map((_,j)=>j);
  pos=0; document.documentElement.style.setProperty("--accent",`var(${L[i].c})`); show();
}
function mark(j){st[lvl]=st[lvl]||[]; if(!st[lvl].includes(j)) st[lvl].push(j); save();}
function next(again){
  const j=queue[pos];
  if(again) queue.push(j); else mark(j);
  pos++; pos<queue.length?show():finish();
}
function show(){
  flipped=false; picked=null; render();
}
function render(){
  const l=L[lvl], j=queue[pos], c=l.cards[j], done=new Set(st[lvl]||[]);
  const dots=l.cards.map((_,k)=>`<i class="${done.has(k)?'on':''} ${k===j?'cur':''}"></i>`).join("");
  let body="";
  if(c.q){
    body=`<span class="kind">快問快答</span><div class="prompt">${esc(c.q)}</div>
    <div class="opts">${c.o.map((o,k)=>{
      let cls=""; if(picked!==null){ if(k===c.r) cls="right"; else if(k===picked) cls="wrong"; }
      return `<button class="opt ${cls}" data-k="${k}" ${picked!==null?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
    ${picked!==null?`<div class="verdict ${picked===c.r?'ok':'no'}">${picked===c.r?'答對！':'差一點'}</div><div class="hook">${esc(c.w)}</div>`:""}`;
  }else if(!flipped){
    body=`<button class="flip" id="fl"><span class="kind">看到這個…</span><div class="prompt">${esc(c.f)}</div><div class="tapnote">點卡片翻面</div></button>`;
  }else{
    body=`<span class="kind">就想到</span><div class="ex">${esc(c.f)}</div><div class="ans">${esc(c.a)}</div><div class="hook">${esc(c.h)}</div>${c.m?`<div class="mine">考過：${esc(c.m)}</div>`:""}`;
  }
  let acts="";
  if(c.q){ acts=picked===null?"":(picked===c.r?`<button class="btn got wide" id="go">下一張</button>`:`<button class="btn again wide" id="ag">等一下再考我一次</button>`); }
  else if(flipped){ acts=`<button class="btn again" id="ag">再看一次</button><button class="btn got" id="go">記住了</button>`; }
  app.innerHTML=`<div class="top"><button class="back" id="bk">← 關卡</button><span class="lvname">${l.name}</span><span class="count">${pos+1}/${queue.length}</span></div>
  <div class="dots">${dots}</div>
  <div class="card" id="cd">${body}</div>
  <div class="actions">${acts}</div>`;
  document.getElementById("bk").onclick=home;
  const fl=document.getElementById("fl"); if(fl){document.getElementById("cd").onclick=()=>{flipped=true;render()}}
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picked=+b.dataset.k;render()});
  const go=document.getElementById("go"), ag=document.getElementById("ag");
  if(go) go.onclick=()=>next(false); if(ag) ag.onclick=()=>next(true);
}
function finish(){
  const l=L[lvl], nx=lvl+1<L.length?lvl+1:null;
  app.innerHTML=`<div class="finish"><img class="art-win" src="${ART}" alt=""><div class="big">過關</div><h1>${l.name}</h1>
  <p class="sub">這關 ${l.cards.length} 張都記住了。休息一下也可以。</p>
  <div class="actions" style="width:100%">${nx!==null?`<button class="btn got wide" id="nx">下一關：${L[nx].name}</button>`:""}<button class="btn again wide" id="hm">回到關卡</button></div></div>`;
  document.getElementById("hm").onclick=home;
  const n=document.getElementById("nx"); if(n) n.onclick=()=>play(nx);
}
home();
</script>

</body>
</html>
